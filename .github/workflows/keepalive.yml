name: keep-supabase-awake
on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read the taxonomy (public, read-only)
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY variables."; exit 1; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/qb_taxonomy_tree" \
                 -H "apikey: $KEY" -H 'content-type: application/json' -d '{}')
          echo "HTTP $code"
          test "$code" = 200
